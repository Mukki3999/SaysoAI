name: Sayso
options:
  bundleIdPrefix: com.mukki
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: XR95QV2C94
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Sayso:
    type: application
    platform: iOS
    sources: [Sayso]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mukki.sayso
        PRODUCT_NAME: Sayso
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sayso/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sayso/Info.plist
      properties:
        CFBundleDisplayName: Sayso
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Sayso listens only while you hold the mic button, to turn what you say into text. Audio is processed on your iPhone and never leaves it.
        NSSpeechRecognitionUsageDescription: Sayso converts your speech to text on your iPhone so it can understand your request. Nothing is sent to a server.
        NSCalendarsWriteOnlyAccessUsageDescription: Sayso adds events to your calendar when you ask it to. It can only add events, not read your existing ones.
        NSRemindersFullAccessUsageDescription: Sayso creates reminders when you ask it to.
        NSContactsUsageDescription: Sayso looks up the person you name so it can address your message or email. Contacts stay on your iPhone.
        NSAlarmKitUsageDescription: Sayso sets alarms and timers when you ask it to, so they ring like any other alarm on your iPhone.
  SaysoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SaysoTests]
    dependencies:
      - target: Sayso
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mukki.sayso.tests
schemes:
  Sayso:
    build:
      targets:
        Sayso: all
    test:
      targets: [SaysoTests]
